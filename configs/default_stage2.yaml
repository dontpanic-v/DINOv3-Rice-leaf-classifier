seed: 42

input_size: 512

batch_size: 32
num_workers: 12
print_freq: 10

lr: 1.0e-4
weight_decay: 0.02
label_smoothing: 0.1
max_norm: 1.0

epochs: 5

output_dir: /content/outputs/stage2

init_checkpoint: /content/outputs/stage1/best_epoch.pth
resume: null

model:
  backbone: vit_huge_plus_patch16_dinov3.lvd1689m

staging:
  freeze_backbone: false
  # backbone gets lr * this factor, head gets full lr
  backbone_lr_factor: 0.1

augmentation:
  severe_threshold: 500
  minority_threshold: 1000

scheduler:
  type: cosine

data:
  base_dir: /content/datasets
  manifest_path: /content/final_manifest.csv
  train_ratio: 0.8
  val_ratio: 0.10
  test_ratio: 0.10

preprocessing:
  keep_classes:
    - Bacterial Leaf Blight
    - Blast
    - Brown Spot
    - Healthy
    - Hispa
    - Leaf Scald
    - Narrow Brown Spot
    - Sheath Blight

  class_mapping:
    bacterial_leaf_blight: Bacterial Leaf Blight
    Bacterial Leaf Blight: Bacterial Leaf Blight
    LeafBlast: Blast
    leaf_blast: Blast
    Leaf Blast: Blast
    BrownSpot: Brown Spot
    brown_spot: Brown Spot
    Brown Spot: Brown Spot
    Sheath Blight: Sheath Blight
    sheath_blight: Sheath Blight
    leaf_scald: Leaf Scald
    Leaf scald: Leaf Scald
    narrow_brown_spot: Narrow Brown Spot
    Narrow Brown Leaf Spot: Narrow Brown Spot
    Hispa: Hispa
    Rice Hispa: Hispa
    rice_hispa: Hispa
    Neck_Blast: Neck Blast
    neck_blast: Neck Blast
    Tungro: Tungro
    tungro: Tungro
    Healthy: Healthy
    healthy: Healthy
    Healthy Rice Leaf: Healthy

  dataset_sources:
    - root: LabelledRice/Labelled
      name: labelled_rice
    - root: RiceLeafs/train
      name: rice_leafs_train
    - root: RiceLeafs/validation
      name: rice_leafs_val
    - root: RiceDiseaseDataset/train
      name: rice_disease_dataset_train
    - root: RiceDiseaseDataset/validation
      name: rice_disease_dataset_val
    - root: RiceLeafsDisease/train
      name: rice_leafs_disease_train
    - root: RiceLeafsDisease/validation
      name: rice_leafs_disease_val
    - root: Rice_Leaf_Diease/Rice_Leaf_Diease/train
      name: rice_leaf_disease_train
    - root: Rice_Leaf_Diease/Rice_Leaf_Diease/test
      name: rice_leaf_disease_test
